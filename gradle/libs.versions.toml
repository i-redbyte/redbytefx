[versions]
agp = "9.0.1"
kotlin = "2.3.10"
detekt = "1.23.7"
compose-bom = "2026.02.01"
activity-compose = "1.12.4"
lifecycle = "2.9.0"
junit4 = "4.13.2"
androidx-test = "1.6.2"
androidx-test-ext = "1.2.1"
robolectric = "4.14.1"
vanniktech-maven-publish = "0.36.0"
annotation = "1.9.1"
dokka = "2.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
vanniktech-maven-publish-base = { id = "com.vanniktech.maven.publish.base", version.ref = "vanniktech-maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

[libraries]
dokka-android-doc = { module = "org.jetbrains.dokka:android-documentation-plugin", version.ref = "dokka" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
