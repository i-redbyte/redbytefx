name: Android build setup
description: Java 17, the Android SDK packages the project compiles against, and Gradle caching.

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Android SDK packages
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        CMDLINE_BIN="${SDK_ROOT}/cmdline-tools/latest/bin"
        if [ ! -x "${CMDLINE_BIN}/sdkmanager" ]; then
          for dir in "${SDK_ROOT}/cmdline-tools"/*; do
            if [ -x "${dir}/bin/sdkmanager" ]; then
              CMDLINE_BIN="${dir}/bin"
              break
            fi
          done
        fi
        if [ ! -x "${CMDLINE_BIN}/sdkmanager" ]; then
          echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
          exit 1
        fi
        echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
        echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
        echo "${CMDLINE_BIN}" >> "${GITHUB_PATH}"
        echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
        export PATH="${CMDLINE_BIN}:${SDK_ROOT}/platform-tools:${PATH}"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
