name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME}"
          CMDLINE_BIN="${SDK_ROOT}/cmdline-tools/latest/bin"
          if [ ! -x "${CMDLINE_BIN}/sdkmanager" ]; then
            for dir in "${SDK_ROOT}/cmdline-tools"/*; do
              if [ -x "${dir}/bin/sdkmanager" ]; then
                CMDLINE_BIN="${dir}/bin"
                break
              fi
            done
          fi
          if [ ! -x "${CMDLINE_BIN}/sdkmanager" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          echo "${CMDLINE_BIN}" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          export PATH="${CMDLINE_BIN}:${SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run quality gate
        run: ./gradlew qualityCheck
