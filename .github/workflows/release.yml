name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag (e.g. v1.1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v1.1.1, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Download published libraries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          base="https://repo.maven.apache.org/maven2/io/github/i-redbyte"
          for attempt in {1..30}; do
            ready=true
            for module in core gl gl-compose compose stdlib 3d; do
              artifact="redbytefx-$module"
              file="$artifact-$VERSION.aar"
              target="dist/$file"
              if [ -s "$target" ]; then
                continue
              fi
              url="$base/$artifact/$VERSION/$file"
              if curl --fail --silent --show-error --location --max-time 60 "$url" -o "$target.tmp" && [ -s "$target.tmp" ]; then
                mv "$target.tmp" "$target"
              else
                rm -f "$target.tmp"
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Some AARs for $VERSION are not available in Maven Central. Publish them, then rerun this workflow for the tag."
              exit 1
            fi
            sleep 60
          done
          for file in dist/*.aar; do
            unzip -tq "$file" > /dev/null
          done
          (cd dist && sha256sum *.aar > SHA256SUMS)

      - name: Build release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## RedByteFX ${VER}"
            echo ""
            awk -v ver="$VER" '
              $0 ~ "^## " ver " " { found=1; next }
              found && /^## / { exit }
              found { print }
            ' docs/changelog.md
            echo ""
            echo "## Maven Central"
            echo ""
            echo '```kotlin'
            for id in core gl gl-compose compose stdlib 3d; do
              echo "implementation(\"io.github.i-redbyte:redbytefx-${id}:${VER}\")"
            done
            echo '```'
            echo ""
            echo "The attached AARs are the published binaries for manual download. Use Maven Central for Gradle projects so dependencies resolve automatically. SHA-256 hashes are in SHA256SUMS."
            echo ""
            echo "Full changelog: [docs/changelog.md](https://github.com/${REPOSITORY}/blob/${TAG}/docs/changelog.md) · [RU](https://github.com/${REPOSITORY}/blob/${TAG}/docs/changelog.ru.md)"
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.aar
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: false
