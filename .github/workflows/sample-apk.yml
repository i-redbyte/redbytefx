name: Sample APK

# Replaces the demo APK after Quality passes on master, so the download never comes from a
# commit that failed the gate.
on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sample-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Android build setup
        uses: ./.github/actions/android-setup

      - name: Assemble universal debug APK
        # The default APK is a single fat binary (all ABIs); the sample has no ABI splits.
        run: ./gradlew :sample:assembleDebug --no-daemon

      - name: Prepare artifact name
        run: cp sample/build/outputs/apk/debug/sample-debug.apk redbytefx-sample-demo.apk

      - name: Publish demo APK (fixed release, overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view demo --repo "${{ github.repository }}" 2>/dev/null; then
            gh release create demo \
              --repo "${{ github.repository }}" \
              --title "Sample demo APK" \
              --notes "Последняя сборка sample-приложения. Коммит: ${SOURCE_SHA}"
          fi
          gh release upload demo redbytefx-sample-demo.apk \
            --repo "${{ github.repository }}" \
            --clobber
